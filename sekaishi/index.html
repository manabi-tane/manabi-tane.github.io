<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>学びのたね</title>
<style>
:root{--bg:#EEF1F3;--ink:#1F2328;--ink-2:#55636D;--line:#7C8A94;--field:#FFFFFF;--accent:#7D4A73;--on-accent:#FFFFFF;--err:#A0302A}
@media (prefers-color-scheme:dark){:root{--bg:#13171B;--ink:#E8E4DC;--ink-2:#909DA7;--line:#6B7782;--field:#1E2227;--accent:#D699CA;--on-accent:#15181C;--err:#F08A80}}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Noto Sans JP",sans-serif}
main{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;box-sizing:border-box}
form{width:100%;max-width:320px}
h1{font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","Noto Serif CJK JP",serif;font-size:26px;font-weight:600;margin:0 0 10px;letter-spacing:.1em}
p{margin:0 0 20px;color:var(--ink-2);font-size:14px;line-height:1.7}
label{display:block;font-size:13px;margin-bottom:6px}
input[type=password]{width:100%;box-sizing:border-box;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink)}
.who{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0}
.rm{display:flex;gap:8px;align-items:center;margin:14px 0 0;color:var(--ink-2)}
.rm input{width:18px;height:18px;margin:0;accent-color:var(--accent)}
button{margin-top:16px;width:100%;font:inherit;font-size:15px;font-weight:600;padding:11px 12px;border:0;border-radius:8px;background:var(--accent);color:var(--on-accent);cursor:pointer}
button:disabled{opacity:.6;cursor:progress}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#msg{min-height:1.5em;margin-top:12px;font-size:13px;line-height:1.5}
#msg.err{color:var(--err)}
</style>
</head>
<body>
<main>
<form id="gate" method="post" action="#" hidden>
  <h1>学びのたね</h1>
  <p>このサイトは鍵がかかっています。パスワードを入れると開きます。</p>
  <input class="who" type="text" name="username" autocomplete="username" value="学びのたね" tabindex="-1" aria-hidden="true" readonly>
  <label for="pw">パスワード</label>
  <input id="pw" name="password" type="password" autocomplete="current-password" required>
  <label class="rm"><input id="rm" type="checkbox" checked>この端末で覚えておく</label>
  <button id="go" type="submit">開く</button>
  <div id="msg" role="status" aria-live="polite"></div>
</form>
<noscript><p>表示には JavaScript が必要です。</p></noscript>
</main>

  var SK = 'manabi:key';
  // アクセス数（GoatCounter）。送るのはページの場所だけで、題名や中身は送らない。空なら数えない。
  var GC = 'https://manabi-tane1.goatcounter.com/count';
  function count(p, event) {
    if (!GC) return;
    var u = GC + '?p=' + encodeURIComponent(p) + (event ? '&e=true' : '') + '&rnd=' + Math.random().toString(36).slice(2);
    try { if (navigator.sendBeacon && navigator.sendBeacon(u)) return; } catch (e) {}
    try { fetch(u, { method: 'POST', mode: 'no-cors', keepalive: true }); } catch (e) {}
  }
  var form = document.getElementById('gate'), pw = document.getElementById('pw'),
      rm = document.getElementById('rm'), go = document.getElementById('go'), msg = document.getElementById('msg');

  function bytes(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function b64(u) { var s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  function say(t, err) { msg.textContent = t; msg.className = err ? 'err' : ''; }

  function stored() {
    try {
      var v = localStorage.getItem(SK) || sessionStorage.getItem(SK);
      var o = v && JSON.parse(v);
      return o && o.s === D.s ? bytes(o.k) : null;   // 鍵を作り直したら古い記録は使わない
    } catch (e) { return null; }
  }
  function forget() { try { localStorage.removeItem(SK); } catch (e) {} try { sessionStorage.removeItem(SK); } catch (e) {} }
  function keep(raw, remember) {
    forget();
    try { (remember ? localStorage : sessionStorage).setItem(SK, JSON.stringify({ s: D.s, k: b64(raw) })); } catch (e) {}
  }

  async function unseal(raw) {
    var k = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    var buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(D.v) }, k, bytes(D.c));
    return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  }
  async function derive(pass) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits']);
    var bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: bytes(D.s), iterations: D.i }, base, 256);
    return new Uint8Array(bits);
  }
  function show(html) { count(location.pathname); document.open(); document.write(html); document.close(); }
  function ask() { count('鍵の画面' + location.pathname, true); form.hidden = false; pw.focus(); }

  if (location.hash === '#logout') { forget(); history.replaceState(null, '', location.pathname + location.search); }
  if (!window.crypto || !crypto.subtle || typeof DecompressionStream === 'undefined') {
    form.hidden = false; form.querySelectorAll('input,button').forEach(function (e) { e.disabled = true; });
    say('このブラウザでは開けません。Safari・Chrome・Edge の新しい版で開いてください。', true);
    return;
  }

  var raw = stored();
  if (raw) unseal(raw).then(show, function () { forget(); ask(); });
  else ask();

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    go.disabled = true; say('確認しています…');
    try {
      var k = await derive(pw.value);
      var html = await unseal(k);           // パスワードが違えばここで失敗する
      keep(k, rm.checked);
      try {
        if (window.PasswordCredential && navigator.credentials)
          await navigator.credentials.store(new PasswordCredential({ id: '学びのたね', password: pw.value, name: '学びのたね' }));
      } catch (e) {}
      show(html);
    } catch (err) {
      go.disabled = false; pw.select();
      say('パスワードが違います。', true);
    }
  });
})();
